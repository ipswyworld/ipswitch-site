name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every three hours so the live-status stamp stays fresh.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Writes public/status.json from a real health check of the live projects.
      - run: node scripts/check-status.mjs
      - run: npm run build
        env:
          SITE_URL: https://ipswitch.co.ke
          # Optional. Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
          # Unset means the contact form and analytics are simply not shown or loaded.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
